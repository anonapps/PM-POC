name: ARGOS PM v1.5 dependency security upgrade
on:
  push:
    branches: [feature/v1.5-approved-enhancements]
    paths: [.github/workflows/v15-dependency-upgrade.yml]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade Next.js and regenerate lockfile
        run: npm install --save-exact next@16.4.2 eslint-config-next@16.4.2
      - name: Verify patched production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit package and lockfile updates on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "fix(security): upgrade Next.js to patched 16.4.2"
          git push origin HEAD:feature/v1.5-approved-enhancements
