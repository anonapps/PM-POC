name: ARGOS PM dependency security audit
on:
  push:
    branches: [main, feature/v1.6-consolidated-enhancements, feature/v1.5-approved-enhancements]
    paths: [package.json, package-lock.json, .github/workflows/security-audit.yml]
  pull_request:
    paths: [package.json, package-lock.json, .github/workflows/security-audit.yml]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Block known moderate or worse production vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report development dependency vulnerabilities
        run: npm audit --audit-level=moderate
        continue-on-error: true
