name: v1.4 validation
on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v14-validation.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
