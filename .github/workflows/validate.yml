name: PM-POC validation
on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full audit (informational until upstream dev-tool fixes)
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
      - name: End-to-end acceptance
        run: CHROME_PATH=$(command -v chromium || command -v chromium-browser) npm run test:e2e
