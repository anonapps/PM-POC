name: PM-POC full lifecycle regression
on:
  # Preserve the ongoing v1.6 branch workflow; main is covered by validate.yml.
  push:
    branches: [feature/v1.6-consolidated-enhancements]
    paths:
      - "e2e/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/regression-lifecycle.yml"
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full lifecycle browser tests
        run: |
          CHROME_PATH=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" npm run test:lifecycle
