name: Publish ARGOS PM v1.5.0 GitHub release
on:
  push:
    tags: [v1.5.0]
permissions:
  contents: read
concurrency:
  group: release-v1.5.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/tags/v1.5.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify stable metadata and successful main validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(node -p 'require("./package.json").version')" = '1.5.0'
          RELEASE_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          test "$RELEASE_SHA" = "$MAIN_SHA"
          PASSED=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$RELEASE_SHA&event=push&per_page=100" --jq '[.workflow_runs[] | select(.path == ".github/workflows/validate.yml" and .head_branch == "main" and .conclusion == "success")] | length')
          test "$PASSED" -ge 1
          test -s public/manuals/1.5/ARGOS_PM_UI_REFERENCE.pdf
          test -s docs/media/argos-pm-demo-v1.5.0.mp4
      - name: Publish versioned assets as latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp public/manuals/1.5/ARGOS_PM_UI_REFERENCE.pdf ARGOS_PM_UI_REFERENCE.pdf
          cp docs/media/argos-pm-demo-v1.5.0.mp4 argos-pm-demo-v1.5.0.mp4
          sha256sum ARGOS_PM_UI_REFERENCE.pdf argos-pm-demo-v1.5.0.mp4 > ARGOS_PM_v1.5.0_SHA256SUMS.txt
          gh release create v1.5.0 --verify-tag --latest --title 'ARGOS PM v1.5.0' --notes-file docs/releases/v1.5.0.md ARGOS_PM_UI_REFERENCE.pdf argos-pm-demo-v1.5.0.mp4 ARGOS_PM_v1.5.0_SHA256SUMS.txt
